name: certification (ACT4)

# Validates the RV32IM core against the OFFICIAL riscv-arch-test suite
# (vendor/riscv-arch-test, ACT4, a pinned submodule). Scoped to I/M only
# today (the core has no CSR/trap/privilege support yet); see
# tools/riscv_build/act/rv32im-min/ and the act: section of
# tools/riscv_build/config.yaml for how that scope grows.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extensions:
        description: "Comma-separated EXTENSIONS= override (default: config.yaml's act.extensions)"
        required: false

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  act4-im:
    # ACT4 tests run entirely under cocotb/GHDL, never on the FPGA, on a
    # GitHub-hosted runner, in the ci-act4 image: it carries the RISC-V GCC, the Sail
    # model that is ACT4's reference, and Ruby, Bundler and the UDB gems of the ACT4
    # commit this repository pins. The VHDL is the one of the Insper-RISC-V submodule.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/ci-act4:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: The platform configs are the ones the platforms generate
        # Nobody edits config.platform-*.yaml by hand: riscv-tools platform sync writes it from the
        # platform config of the Insper-RISC-V submodule, with the paths from this project's root.
        run: |
          for platform in "internal-mem src/simulation/internal-mem" "de0-cv src/cyclone-v/de0-cv"; do
            set -- $platform
            riscv-tools --root . platform sync --check \
              --source "Insper-RISC-V/$2/config.yaml" --prefix Insper-RISC-V \
              --output "tools/riscv_build/config.platform-$1.yaml"
          done

      - name: The targets and the configs of the profiles are the ones the generators write
        run: |
          uv run python tools/riscv_build/gen_profiles.py
          uv run python tools/riscv_build/gen_flash_profiles.py
          test -z "$(git status --porcelain -- tools/riscv_build)" || { git status --short -- tools/riscv_build; echo "regenerate the profiles and commit them"; exit 1; }

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Run ACT4 certification (build + cocotb/GHDL)
        run: |
          riscv-tools --config tools/riscv_build/config.yaml certify \
            ${{ inputs.extensions && format('--extensions {0}', inputs.extensions) || '' }}

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: act4-waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
