name: certification (ACT4)

# Validates the RV32IM core against the OFFICIAL riscv-arch-test suite
# (vendor/riscv-arch-test, ACT4, a pinned submodule). Scoped to I/M only
# today (the core has no CSR/trap/privilege support yet); see
# tools/riscv_build/act/rv32im-min/ and the act: section of
# tools/riscv_build/config.yaml for how that scope grows.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extensions:
        description: "Comma-separated EXTENSIONS= override (default: config.yaml's act.extensions)"
        required: false

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  act4-im:
    # ACT4 tests run entirely under cocotb/GHDL, never on the FPGA, on a
    # GitHub-hosted runner, in the ci-elf image: it carries the RISC-V GCC, the Sail
    # model that is ACT4's reference, and Ruby, Bundler and the UDB gems of the ACT4
    # commit this repository pins.
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/insper-riscv/ci-elf:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Checkout Core, Memory and TopLevel (the VHDL sources)
        # config.yaml's sim.vhdl_sources are "../Core/..." (the core),
        # "../Memory/..." (the memories) and "../TopLevel/..." (the
        # simulation top), true once all are cloned as siblings of this checkout.
        run: |
          rm -rf ../Core ../Common-Components ../Memory ../TopLevel
          git clone --depth 1 https://github.com/insper-riscv/Core.git ../Core
          git clone --depth 1 https://github.com/insper-riscv/Common-Components.git ../Common-Components
          git clone --depth 1 https://github.com/insper-riscv/Memory.git ../Memory
          git clone --depth 1 https://github.com/insper-riscv/TopLevel.git ../TopLevel

      - name: Install Python dependencies (riscv-tools, editable from tools/Tools, + its sim extra)
        run: uv sync

      - name: Run ACT4 certification (build + cocotb/GHDL)
        run: |
          uv run riscv-tools --config tools/riscv_build/config.yaml certify \
            ${{ inputs.extensions && format('--extensions {0}', inputs.extensions) || '' }}

      - name: Upload waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: act4-waveforms
          path: "**/*.ghw"
          if-no-files-found: ignore
