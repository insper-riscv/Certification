name: certification (ACT4)

# Validates the core against the OFFICIAL riscv-arch-test suite (vendor/riscv-arch-test, ACT4, a pinned
# submodule), in simulation. It certifies the minimal profiles (tools/riscv_build/minimal_profiles.yaml: for each
# extension that ACT4 has tests for, the smallest profile that contains it, plus one with everything) on every
# memory model the modular top accepts (ROM and RAM inside or outside the chip, each outside one behind its
# cache). The target of each pair is generated at run time by tools/riscv_build/gen_profiles.py and nothing of
# it is committed. The pairs the top does not accept, and why, are printed by the job "plan". Another profile,
# or every profile, is certified on demand by the workflows "certification (ACT4, one profile and memory
# model)" and "certification (ACT4, all profiles and memory models)".
on:
  # Push only on the main: in another branch the pull_request already runs the same workflow.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The generated files are the ones the generators write: nobody edits them by hand.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/insper-riscv/ci-act4:latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: The platform configs are the ones the platforms generate
        # Nobody edits config.platform-*.yaml by hand: riscv-tools platform sync writes it from the
        # platform config of the Insper-RISC-V submodule, with the paths from this project's root.
        run: |
          for platform in "internal-mem src/simulation/internal-mem" "de0-cv src/cyclone-v/de0-cv"; do
            set -- $platform
            riscv-tools --root . platform sync --check \
              --source "Insper-RISC-V/$2/config.yaml" --prefix Insper-RISC-V \
              --output "tools/riscv_build/config.platform-$1.yaml"
          done

      - name: The targets and the configs of the profiles are the ones the generators write
        run: |
          uv run python tools/riscv_build/gen_profiles.py
          uv run python tools/riscv_build/gen_flash_profiles.py
          test -z "$(git status --porcelain -- tools/riscv_build)" || { git status --short -- tools/riscv_build; echo "regenerate the profiles and commit them"; exit 1; }

      - name: Check the VHDL style
        run: riscv-tools --root . check-vhdl-style

  plan:
    # The pairs (minimal profile, memory model) that the next job runs, printed with the pairs left out.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: ghcr.io/insper-riscv/ci-act4:latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - uses: actions/checkout@v7

      - name: Print and write the matrix
        id: matrix
        run: |
          uv run python tools/riscv_build/act_matrix.py minimal \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  act4:
    needs: plan
    # ACT4 tests run entirely under cocotb/GHDL, never on the FPGA, on a GitHub-hosted runner, in the ci-act4
    # image: it carries the RISC-V GCC, the Sail model that is ACT4's reference, and Ruby, Bundler and the UDB
    # gems of the ACT4 commit this repository pins. The VHDL is the one of the Insper-RISC-V submodule.
    name: ${{ matrix.profile }} / ${{ matrix.slug }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    container:
      image: ghcr.io/insper-riscv/ci-act4:latest
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Python dependencies (cocotb and PyYAML; riscv-tools comes from the image)
        run: uv sync

      - name: Generate the target of the pair (nothing of it is versioned)
        env:
          PROFILE: ${{ matrix.profile }}
          MEMORY: ${{ matrix.memory }}
        run: |
          uv run python tools/riscv_build/gen_profiles.py --profile "$PROFILE" --memory "$MEMORY" --out build/target --jobs 4
          case "$PROFILE" in rv32e*) sh tools/riscv_build/install_udb_overlay.sh ;; esac

      - name: Run the ACT4 certification of the pair (build + cocotb/GHDL)
        run: riscv-tools --config build/target/config.yaml certify

      - name: Upload the log and the waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: act4-${{ matrix.profile }}-${{ matrix.slug }}
          path: |
            logs/certification/latest.log
            **/*.ghw
          if-no-files-found: ignore

  act4-im:
    # The single check that stands for the whole certification: it passes when the generated files are the
    # committed ones and every pair passed.
    needs: [check, act4]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.check.result }} ${{ needs.act4.result }}
        run: |
          echo "check, act4: $RESULTS"
          [ "$RESULTS" = "success success" ]
