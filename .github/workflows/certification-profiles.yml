name: certification (ACT4, all profiles)

# Runs the ACT4 certification, in simulation, of every profile of the core: one job, and so one
# separate runner, per profile. A profile without Zifencei is a tools/riscv_build/config.profile-<name>.yaml
# and one with Zifencei, which needs the caches, a tools/riscv_build/config.flash-<name>.yaml (both
# written by the generators from Insper-RISC-V/Core/profiles/matrix.yaml), so a new profile gets its
# runner as soon as its configuration is committed. The VHDL is the one of the Insper-RISC-V submodule.
# It runs only on demand (each profile takes about 15 minutes and the base-platform ones need a runner
# with about 15 GiB of RAM).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Regular expression on the name of the config (profile-<name> or flash-<name>); empty runs every profile"
        required: false
        default: ""

concurrency:
  group: certification-profiles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    # One entry per committed profile configuration; the matrix of the next job is built from it.
    runs-on: ubuntu-26.04
    outputs:
      profiles: ${{ steps.names.outputs.profiles }}
    steps:
      - uses: actions/checkout@v7

      - name: List the profiles
        id: names
        env:
          ONLY: ${{ inputs.only }}
        run: |
          names=$(ls tools/riscv_build/config.profile-*.yaml tools/riscv_build/config.flash-rv*.yaml \
            | sed -E 's#.*/config\.(.*)\.yaml#\1#' \
            | grep -E "${ONLY:-.}" \
            | sort)
          test -n "$names" || { echo "no profile matches '${ONLY}'"; exit 1; }
          echo "profiles=$(echo "$names" | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "$names" | wc -l | xargs echo "profiles:"

  act4:
    needs: list
    # ACT4 tests run entirely under cocotb/GHDL, never on the FPGA, in the ci-act4 image: it carries
    # the RISC-V GCC, the Sail model that is ACT4's reference, and Ruby, Bundler and the UDB gems of
    # the ACT4 commit this repository pins. A profile of the base platform simulates large memories
    # and needs about 15 GiB of RAM, so it must not share a runner with another one.
    name: ${{ matrix.profile }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    container:
      image: ghcr.io/insper-riscv/ci-act4:latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.list.outputs.profiles) }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Python dependencies (cocotb; riscv-tools comes from the image)
        run: uv sync

      - name: Run the ACT4 certification of the profile (build + cocotb/GHDL)
        run: riscv-tools --config tools/riscv_build/config.${{ matrix.profile }}.yaml certify

      - name: Upload the log and the waveforms
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: act4-${{ matrix.profile }}
          path: |
            logs/certification/latest.log
            **/*.ghw
          if-no-files-found: ignore
