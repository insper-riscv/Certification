[project]
name = "riscv-certification"
version = "0.3.0"
description = "ACT4 (riscv-arch-test) certification of the RV32IM core, driven by riscv-tools (installed in the CI image)."
license = "Apache-2.0"
# Same Python as the ci-* images of Infra, which also carry riscv-tools.
requires-python = ">=3.14,<3.15"
dependencies = [
    # The per-entity cocotb tests and the ACT4 simulation run with cocotb (and its cocotb_tools),
    # at the version of the ci-* images. riscv-tools comes from the image, not from here.
    "cocotb==2.1.0",
    # The generators of the ACT4 targets read minimal_profiles.yaml.
    "pyyaml>=6.0",
]

[tool.uv]
# Not a distributable package itself: a project that runs scripts and tests with the
# riscv-tools of the image.
package = false
