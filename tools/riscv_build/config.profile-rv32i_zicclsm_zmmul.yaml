# The ACT4 track of the profile rv32i_zicclsm_zmmul on the plain platform: config.yaml (the internal-mem
# platform and the ACT4 settings) with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32i_zicclsm_zmmul.yaml certify
extends: config.yaml

sim:
  parameters:
    HAS_ZICSR: "false"
    HAS_ZICCLSM: "true"
    HAS_ZICNTR: "false"
    HAS_ZIHPM: "false"
    HAS_M: "false"
    HAS_ZMMUL: "true"

act:
  target_config: tools/riscv_build/act/profile-rv32i_zicclsm_zmmul/test_config.yaml
  extensions: "I,Zmmul,Zicclsm"
