# The ACT4 ELFs of flash-rv32i_zifencei on the board (DE0-CV): the platform with the FLASH behind the caches
# supplies the memory map, the JTAG device and the debug ports, and this file adds the ACT4 side. The
# code goes to the FLASH storage (132 KB) over the memory editor and the data to the SDRAM through the
# debug port. The board must be programmed with that platform.
#
#   uv run riscv-tools --config tools/riscv_build/config.flash-board-rv32i_zifencei.yaml certify-board --skip-build
extends: ../../../TopLevel/platforms/sdram-flash/config.yaml

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/flash-rv32i_zifencei/test_config.yaml
  extensions: "I,Zifencei"
  jobs: 0
  # tests that rewrite their own code run from the variant, with the body in the SDRAM
  ram_tests: [Zifencei-fence.i-00]
  ram_target_config: tools/riscv_build/act/flash-ram-rv32i_zifencei/test_config.yaml
  ram_extensions: "Zifencei"
  flash_base: 0x20000000
  # the words of the FLASH storage in the FPGA: an ELF whose code is larger is reported, not run
  flash_words: 33792
  sdram_base: 0x40000000
  sdram_region_bytes: 0x100000
  board_timeout_s: 30
  board_display: true
