# The ACT4 track of flash-rv32i_zifencei_zmmul on the platform with the FLASH behind the caches: the platform
# (config.platform-de0-cv.yaml) with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.flash-rv32i_zifencei_zmmul.yaml certify
extends: config.platform-de0-cv.yaml

sim:
  parameters:
    BOOT_ROM_FILE: "{boot_hex_path}"
    ROM_FILE: "{hex_path}"
    SDRAM_FILE: "{sdram_hex_path}"
    HAS_ZICSR: "false"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "false"
    HAS_ZIHPM: "false"
    HAS_M: "false"
    HAS_ZMMUL: "true"
    HAS_ZIFENCEI: "true"

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/flash-rv32i_zifencei_zmmul/test_config.yaml
  extensions: "I,Zmmul,Zifencei"
  jobs: 0
  # tests that rewrite their own code run from the variant, with the body in the SDRAM
  ram_tests: [Zifencei-fence.i-00]
  ram_target_config: tools/riscv_build/act/flash-ram-rv32i_zifencei_zmmul/test_config.yaml
  ram_extensions: "Zifencei"
  # The code is in the FLASH, behind the caches, and the data in the SDRAM; the boot ROM jumps to the FLASH.
  flash_base: 0x20000000
  sdram_base: 0x40000000
  sim_parameters:
    rom_addr_width: "18"
    ram_addr_width: "9"
