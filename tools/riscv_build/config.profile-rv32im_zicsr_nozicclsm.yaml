# Configuration of the ACT4 (riscv-arch-test) certification track, driven
# by `riscv-tools certify`. This repo holds only the certification: the
# official suite (vendor/riscv-arch-test, a pinned submodule), the DUT
# target (tools/riscv_build/act/rv32im-min/) and its cocotb testbench.
#
# ACT4 runs entirely in simulation (cocotb/GHDL), never on the board, on
# the same pipeline the hardware runs. The VHDL comes from a sibling
# checkouts of Core (../Core, the processor), Memory (../Memory, the
# memories) and TopLevel (../TopLevel, the simulation top), which CI clones next to this repo.

toolchain:
  # The RISC-V GCC of insper-riscv/Infra (ci-elf image).
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy

isa:
  base: i
  default_ext: ""
  canonical_order: "MAFDQLCBJTPVNH"

# Only the fields `certify` and the defaults need; ACT4 brings its own
# linker script (act/rv32im-min/link.ld), memory map and halt/print macros.
memory:
  mailbox_addr: 0x0002FFFC

paths:
  build_dir: build

sim:
  # The simulation-only top (plain VHDL arrays cocotb can read), not the
  # hardware top, which instantiates Quartus altsyncram IP.
  toplevel: rv32i3stage_core_sim_test
  # In dependency order, relative to this project's root.
  vhdl_sources:
    - ../Core/common/pipeline_types.vhd
    - ../Core/common/byte_mask_consts.vhd
    - ../Core/common/opcode_consts.vhd
    - ../Core/common/funct3_consts.vhd
    - ../Core/common/funct7_consts.vhd
    - ../Core/common/alu_consts.vhd
    - ../Core/common/ext_imm_consts.vhd
    - ../Core/common/ext_ram_consts.vhd
    - ../Core/common/wb_sel_consts.vhd
    - ../Core/common/pc_src_consts.vhd
    - ../Core/common/mem_map_consts.vhd
    - ../Common-Components/src/generic_register.vhd
    - ../Common-Components/src/adder.vhd
    - ../Common-Components/src/mux_2x1.vhd
    - ../Common-Components/src/mux_4x1.vhd
    - ../Common-Components/src/flip_flop.vhd
    - ../Common-Components/src/utils_pkg.vhd
    - ../Core/I/alu.vhd
    - ../Common-Components/src/onehot_decoder.vhd
    - ../Common-Components/src/mux_tree.vhd
    - ../Core/common/reg_file.vhd
    - ../Core/I/extender_imm.vhd
    - ../Core/I/extender_ram.vhd
    - ../Core/I/store_manager.vhd
    - ../Core/I/misaligned_unit.vhd
    - ../Core/common/control_unit.vhd
    - ../Core/common/bubble_mux.vhd
    - ../Core/common/forwarding_unit.vhd
    - ../Core/common/hazard_detection_unit.vhd
    - ../Core/M/m_decode.vhd
    - ../Core/M/booth_multiplier_rv32.vhd
    - ../Core/M/non_restoring_divider_rv32.vhd
    - ../Core/M/multdiv.vhd
    - ../Core/Zicsr/csr_decode.vhd
    - ../Core/Zicsr/csr_addr_consts.vhd
    - ../Core/Zicntr/counter64.vhd
    - ../Core/Zicntr/tick_divider.vhd
    - ../Core/Zicsr/csr_file.vhd
    - ../Core/Zicsr/trap_unit.vhd
    - ../Core/Zifencei/fencei_unit.vhd
    - ../Core/common/pc_fetch.vhd
    - ../Core/common/reg_if_id.vhd
    - ../Core/common/reg_id_ex.vhd
    - ../Core/common/reg_ex_mem.vhd
    - ../Core/common/reg_mem_wb.vhd
    - ../Core/core/stage_if.vhd
    - ../Core/core/stage_id.vhd
    - ../Core/core/stage_ex.vhd
    - ../Core/core/stage_mem.vhd
    - ../Core/core/stage_wb.vhd
    - ../Core/core/core.vhd
    - ../Memory/sim/ram_simulation.vhd
    - ../Memory/sim/rom_simulation.vhd
    - ../TopLevel/platforms/internal-mem/rtl/clk_gen_3way.vhd
    - ../TopLevel/platforms/internal-mem/rtl/rv32i3stage_core_sim_test.vhd
  ghdl_std: "08"
  # The ACT4 images the harness writes for each ELF: the code of the test also goes to the boot
  # ROM (the core fetches from it below 0x800), and the data goes to the RAM.
  parameters:
    BOOT_ROM_FILE: "{boot_hex_path}"
    ROM_FILE: "{hex_path}"
    RAM_FILE: "{ram_hex_path}"
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_M: "true"
    HAS_ZMMUL: "false"

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/profile-rv32im_zicsr_nozicclsm/test_config.yaml
  # Extensions the core implements (comma-separated); add them as the RTL grows them.
  extensions: "I,M,Zicsr"
  # Where the data region of the ELFs starts (the RAM) and the size of the boot ROM.
  ram_base: 0x400000
  boot_rom_bytes: 0x800
  # An architectural test can be far larger than the board's FLASH/RAM, and
  # ACT4 never runs on hardware, so the simulation memories are sized
  # generously (link.ld's MEMORY block must match: 4M/2M).
  sim_parameters:
    rom_addr_width: "20"
    ram_addr_width: "19"
