# The ACT4 track of flash-ram-rv32im_zicntr_zihpm_zifencei on the platform with the FLASH behind the caches: the platform
# (config.platform-de0-cv.yaml) with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.flash-ram-rv32im_zicntr_zihpm_zifencei.yaml certify
extends: config.platform-de0-cv.yaml

sim:
  parameters:
    BOOT_ROM_FILE: "{boot_hex_path}"
    ROM_FILE: "{hex_path}"
    SDRAM_FILE: "{sdram_hex_path}"
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "true"
    HAS_ZIHPM: "true"
    HAS_M: "true"
    HAS_ZMMUL: "false"
    HAS_ZIFENCEI: "true"

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/flash-ram-rv32im_zicntr_zihpm_zifencei/test_config.yaml
  extensions: "Zifencei"
  jobs: 0
  # The code is in the FLASH, behind the caches, and the data in the SDRAM; the boot ROM jumps to the FLASH.
  flash_base: 0x20000000
  sdram_base: 0x40000000
  sim_parameters:
    rom_addr_width: "18"
    ram_addr_width: "9"
