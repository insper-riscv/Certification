# The ACT4 track of the profile rv32e_zicclsm_zimop_zmmul on the modular platform with the memories inside the chip:
# config.modular.yaml with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32e_zicclsm_zimop_zmmul.yaml certify
extends: config.modular.yaml

isa:
  base: e

sim:
  parameters:
    HAS_E: "true"
    HAS_ZICSR: "false"
    HAS_ZICCLSM: "true"
    HAS_ZICNTR: "false"
    HAS_ZIHPM: "false"
    HAS_M: "false"
    HAS_ZMMUL: "true"
    HAS_ZIMOP: "true"

act:
  target_config: tools/riscv_build/act/profile-rv32e_zicclsm_zimop_zmmul/test_config.yaml
  extensions: "E,Zmmul,Zicclsm,Zimop"
