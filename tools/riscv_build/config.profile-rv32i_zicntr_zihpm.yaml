# The ACT4 track of the profile rv32i_zicntr_zihpm on the plain platform: config.yaml (the internal-mem
# platform and the ACT4 settings) with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32i_zicntr_zihpm.yaml certify
extends: config.yaml

sim:
  parameters:
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "true"
    HAS_ZIHPM: "true"
    HAS_M: "false"
    HAS_ZMMUL: "false"

act:
  target_config: tools/riscv_build/act/profile-rv32i_zicntr_zihpm/test_config.yaml
  extensions: "I,Zicsr,Zicntr,Zihpm"
