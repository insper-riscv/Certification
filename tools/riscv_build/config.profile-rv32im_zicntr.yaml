# The ACT4 track of the profile rv32im_zicntr on the plain platform: config.yaml (the internal-mem
# platform and the ACT4 settings) with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32im_zicntr.yaml certify
extends: config.yaml

sim:
  parameters:
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "true"
    HAS_ZIHPM: "false"
    HAS_M: "true"
    HAS_ZMMUL: "false"

act:
  target_config: tools/riscv_build/act/profile-rv32im_zicntr/test_config.yaml
  extensions: "I,M,Zmmul,Zicsr,Zicntr"
