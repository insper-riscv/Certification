# The ACT4 track of the profile rv32im_zihpm on the modular platform with the memories inside the chip:
# config.modular.yaml with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32im_zihpm.yaml certify
extends: config.modular.yaml

sim:
  parameters:
    HAS_E: "false"
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "false"
    HAS_ZIHPM: "true"
    HAS_M: "true"
    HAS_ZMMUL: "false"

act:
  target_config: tools/riscv_build/act/profile-rv32im_zihpm/test_config.yaml
  extensions: "I,M,Zmmul,Zicsr,Zihpm"
