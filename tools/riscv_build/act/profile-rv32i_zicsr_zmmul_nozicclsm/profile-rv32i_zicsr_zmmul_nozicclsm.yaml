# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
#
# UDB architecture config for rv32im_pipeline_core: RV32IM with Zicsr.
#
# Sm is declared because this schema version cannot configure MXLEN without it
# (a fully configured architecture without Sm rejects MXLEN, and a partially
# configured one crashes inside the udb gem). The core is machine mode only: no
# PMP, no HPM counters and no interrupt sources.
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: profile-rv32i_zicsr_zmmul_nozicclsm
description: >-
  rv32i_zicsr_zmmul_nozicclsm, machine mode only.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Sm, version: "= 1.12.0" }

params:
  # XLEN
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32

  # MISA
  MISA_CSR_IMPLEMENTED: true

  # endianness — real, not a placeholder: matches this core's actual
  # StoreManager/RAM byte ordering (little-endian, like every RISC-V
  # implementation).
  M_MODE_ENDIANNESS: little

  # trap/exception behavior: ecall, ebreak and a CSR that does not exist or cannot be
  # written trap into mtvec. An unknown opcode stays a NOP (no illegal-instruction trap),
  # and the reserved SYSTEM encodings that the core rejects are not tested by ACT4.
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: false
  TRAP_ON_RESERVED_INSTRUCTION: false
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # mtval: the faulting address for misaligned accesses and jump targets, zero otherwise.
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: true
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false
  MTVAL_WIDTH: 32

  # Misaligned load/store raise an exception; the hardware does not split them in two accesses.
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low

  # CSR / implementation IDs — marchid/mimpid/mconfigptr CSRs don't
  # exist, so ARCH_ID_VALUE/IMP_ID_VALUE aren't required either
  # (matches cv32e20.yaml's own comment: only required when the
  # corresponding _IMPLEMENTED flag is true).
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  CONFIG_PTR_ADDRESS: 0x0
  # mvendorid doesn't exist either — 0x0/0x0 (no JEDEC bank/offset
  # allocated to this project), unlike cv32e20's real 0xC/0x2.
  VENDOR_ID_BANK: 0x0
  VENDOR_ID_OFFSET: 0x0

  # MTVEC — no mtvec CSR exists; Direct is the simplest single legal
  # mode to declare (schema requires at least one).
  MTVEC_MODES: [0]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  # Spec-minimum for Direct mode (mtvec's bottom 2 bits are always
  # reserved/hardwired 0 regardless of implementation).
  MTVEC_BASE_ALIGNMENT_DIRECT: 4

  # This core's 3-stage in-order pipeline has no speculative/OoO
  # execution — same reasoning as cv32e20.yaml's own comment ("2-stage
  # in-order pipeline has no imprecise exception path"), real even
  # though nothing traps today.
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true

  # No PMA hardware; this core's RAM byte-enable (ram_byteena, see
  # StoreManager.vhd) is a 4-byte natural granule.
  PMA_GRANULARITY: 2

  # No PMP hardware.
  NUM_PMP_ENTRIES: 0

  # No HPM counters, no mcountinhibit/mcounteren CSRs — every index
  # false (32 HPM counter slots, indices 0..31).
  MCOUNTINHIBIT_IMPLEMENTED: false
  HPM_COUNTER_EN: [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]
  MCOUNTENABLE_EN: [
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
      false, false, false, false, false, false, false, false,
    ]

  # No interrupt sources: the machine-level interrupt pending bits stay zero.
  MEI_INTR_IMPL: false
  MSI_INTR_IMPL: false
  MTI_INTR_IMPL: false

  # Parameters that the UDB version in use requires.
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  WFI_FINITE: false
  WFI_U_MODE: false
