# The ACT4 track with the code and the data of every test in the SDRAM (rv32im-sdram): the platform
# simulation of the SDRAM, with the real instruction cache, the arbiter of three masters and the
# chip model, loaded with the ELF at time zero. The toolchain, ISA and memory sections are those of
# config.yaml (a variant that extended it would keep its RAM image parameter, which this top lacks).
#
#   uv run riscv-tools --config tools/riscv_build/config.sdram.yaml certify

toolchain:
  # The RISC-V GCC of insper-riscv/Infra (infra-toolchain image).
  gcc: riscv32-unknown-elf-gcc
  objcopy: riscv32-unknown-elf-objcopy

isa:
  base: i
  default_ext: ""
  canonical_order: "MAFDQLCBJTPVNH"

# Only the fields `certify` and the defaults need; ACT4 brings its own
# linker script (act/rv32im-min/link.ld), memory map and halt/print macros.
memory:
  mailbox_addr: 0x0002FFFC

paths:
  build_dir: build

sim:
  ghdl_std: "08"
  toplevel: rv32im_sdram_sim_test
  vhdl_sources:
    - ../Core/common/rv32i_ctrl_consts.vhd
    - ../Core/common/rv32im_pipeline_types.vhd
    - ../Core/common/genericRegister.vhd
    - ../Core/common/genericAdder.vhd
    - ../Core/common/genericAdderU.vhd
    - ../Core/common/genericMux2x1.vhd
    - ../Core/common/genericMux3x1.vhd
    - ../Core/common/FlipFlop.vhd
    - ../Core/I/ALU.vhd
    - ../Core/common/RegFile.vhd
    - ../Memory/sim/RAM_simulation.vhd
    - ../Memory/sim/ROM_simulation.vhd
    - ../Memory/external/sdram/sdram_pkg.vhd
    - ../Memory/external/sdram/sdram_ctrl.vhd
    - ../Memory/external/sdram/sdram_cpu_bridge.vhd
    - ../Memory/external/sdram/sdram_arbiter.vhd
    - ../Memory/external/cache/icache.vhd
    - ../Memory/external/sdram/sdram_dbg_master.vhd
    - ../Memory/external/sdram/sdram_jtag_core.vhd
    - ../Memory/external/sdram/sim/sdram_model.vhd
    - ../Memory/external/sdram/sim/sdram_system.vhd
    - ../Memory/external/bus/jtag_uart.vhd
    - ../Memory/external/bus/ext_interconnect.vhd
    - ../Core/common/InstructionDecoder.vhd
    - ../Core/I/ExtenderImm.vhd
    - ../Core/I/ExtenderRAM.vhd
    - ../Core/I/StoreManager.vhd
    - ../TopLevel/platforms/internal-mem/rtl/clk_gen_3way.vhd
    - ../Core/common/control_unit.vhd
    - ../Core/common/bubble_mux.vhd
    - ../Core/common/forwarding_unit.vhd
    - ../Core/common/hazard_detection_unit.vhd
    - ../Core/common/extendSigned.vhd
    - ../Core/M/decoderM.vhd
    - ../Core/M/m_decode.vhd
    - ../Core/M/booth_multiplier_rv32.vhd
    - ../Core/M/non_restoring_divider_rv32.vhd
    - ../Core/M/mult.vhd
    - ../Core/M/div.vhd
    - ../Core/M/divu.vhd
    - ../Core/M/multdiv.vhd
    - ../Core/Zicsr/csr_decode.vhd
    - ../Core/Zicsr/csr_file.vhd
    - ../Core/Zicsr/trap_unit.vhd
    - ../Core/Zifencei/fencei_unit.vhd
    - ../Core/common/pc_fetch.vhd
    - ../Core/common/reg_IF_ID.vhd
    - ../Core/common/reg_ID_EX.vhd
    - ../Core/common/reg_EX_MEM.vhd
    - ../Core/common/reg_MEM_WB.vhd
    - ../Core/cores/rv32im_pipeline_core.vhd
    - ../TopLevel/platforms/sdram/rtl/rv32im_sdram_sim_test.vhd
  parameters:
    BOOT_ROM_FILE: "{boot_hex_path}"
    ROM_FILE: "{hex_path}"
    SDRAM_FILE: "{sdram_hex_path}"
    HAS_ZICSR: "true"
    HAS_ZIFENCEI: "true"

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/rv32im-sdram/test_config.yaml
  extensions: "I,M,Zicsr,Zifencei"
  jobs: 0
  # Where the SDRAM starts: the ELF is one image from here, and the boot ROM jumps here.
  sdram_base: 0x40000000
  # the simulation memories of the platform that the ELF does not use stay small
  sim_parameters:
    rom_addr_width: "9"
    ram_addr_width: "9"
