# Configuration of the ACT4 (riscv-arch-test) certification track, driven
# by `riscv-tools certify`. This repo holds only the certification: the
# official suite (the checkout of ACT4 in the ci-act4 image, act.vendor_dir), the DUT
# targets (tools/riscv_build/act/) and their cocotb testbenches.
#
# ACT4 runs entirely in simulation (cocotb/GHDL), never on the board. The machine it runs on is the
# modular simulation platform of insper-riscv/Insper-RISC-V, a submodule of this repository
# (config.modular.yaml, written by gen_profiles.py), and this file adds only what is the
# certification's: the smoke target I, M and Zicsr.
extends: config.modular.yaml

sim:
  # The extensions of the core are the ones of this target: Zicsr and M.
  parameters:
    HAS_ZICSR: "true"
    HAS_M: "true"

act:
  target_config: tools/riscv_build/act/rv32im-min/test_config.yaml
  # Extensions the core implements (comma-separated); add them as the RTL grows them.
  extensions: "I,M,Zicsr"
