# Configuration of the ACT4 (riscv-arch-test) certification track, driven
# by `riscv-tools certify`. This repo holds only the certification: the
# official suite (vendor/riscv-arch-test, a pinned submodule), the DUT
# target (tools/riscv_build/act/rv32im-min/) and its cocotb testbench.
#
# ACT4 runs entirely in simulation (cocotb/GHDL), never on the board, on
# the same pipeline the hardware runs. The machine it runs on (toolchain,
# memory map, VHDL sources and top) is the platform's, in
# insper-riscv/Insper-RISC-V, a submodule of this repository. The platform
# config is generated by `riscv-tools platform sync`, with its paths written
# from this project's root (Insper-RISC-V/Core, Insper-RISC-V/Memory, ...),
# and this file extends it and adds only what is the certification's.
extends: config.platform-internal-mem.yaml

paths:
  build_dir: build

sim:
  # The images the harness writes for each ELF: the code of the test also goes to the boot
  # ROM (the core fetches from it below 0x800), and the data goes to the RAM. The extensions
  # of the core are the ones of this target: Zicsr only.
  parameters:
    BOOT_ROM_FILE: "{boot_hex_path}"
    ROM_FILE: "{hex_path}"
    RAM_FILE: "{ram_hex_path}"
    HAS_ZICSR: "true"
    HAS_ZICNTR: "false"
    HAS_ZIHPM: "false"

act:
  vendor_dir: vendor/riscv-arch-test
  target_config: tools/riscv_build/act/rv32im-min/test_config.yaml
  # Extensions the core implements (comma-separated); add them as the RTL grows them.
  extensions: "I,M,Zicsr"
  # Where the data region of the ELFs starts (the RAM) and the size of the boot ROM.
  ram_base: 0x400000
  boot_rom_bytes: 0x800
  # An architectural test can be far larger than the board's FLASH/RAM, and
  # ACT4 never runs on hardware, so the simulation memories are sized
  # generously (link.ld's MEMORY block must match: 4M/2M).
  sim_parameters:
    rom_addr_width: "20"
    ram_addr_width: "19"
