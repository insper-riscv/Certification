# The ACT4 track of the profile rv32i_zicntr_zihpm_zmmul on the modular platform with the memories inside the chip:
# config.modular.yaml with the target, the extensions and the hardware of the profile.
#
#   uv run riscv-tools --config tools/riscv_build/config.profile-rv32i_zicntr_zihpm_zmmul.yaml certify
extends: config.modular.yaml

sim:
  parameters:
    HAS_E: "false"
    HAS_ZICSR: "true"
    HAS_ZICCLSM: "false"
    HAS_ZICNTR: "true"
    HAS_ZIHPM: "true"
    HAS_M: "false"
    HAS_ZMMUL: "true"

act:
  target_config: tools/riscv_build/act/profile-rv32i_zicntr_zihpm_zmmul/test_config.yaml
  extensions: "I,Zmmul,Zicsr,Zicntr,Zihpm"
