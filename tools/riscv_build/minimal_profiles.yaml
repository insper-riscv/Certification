# The minimal profiles of the automatic certification: for every extension that ACT4 has a test folder for, the
# smallest profile whose set of extensions contains the REQUIRED_EXTENSIONS of that folder (the test header of the
# pinned vendor/riscv-arch-test lists them), plus one profile with everything the core implements. Each profile is
# certified on every memory model that the modular top accepts (memory_models.py) and that the profile can use.
#
# `extensions` lists what the profile adds to the base of its name (I for rv32i, E for rv32e). The ones that
# the matrix of the Core (Insper-RISC-V/Core/profiles/matrix.yaml) does not know (Zimop, Zicond, Zihintntl and
# Zihintpause, the `extras` of a platform) are written here and only here. `tests` counts the ACT4 tests whose
# REQUIRED_EXTENSIONS the profile covers (the ones of the extensions below it included).
profiles:
  - {name: rv32i,              extensions: [],                     tests: 39,  covers: "tests/rv32i/I"}
  - {name: rv32im,             extensions: [M],                    tests: 51,  covers: "tests/rv32i/M"}
  - {name: rv32i_zmmul,        extensions: [Zmmul],                tests: 43,  covers: "tests/rv32i/Zmmul (the RTL variant that multiplies without dividing)"}
  - {name: rv32i_zicsr,        extensions: [Zicsr],                tests: 45,  covers: "tests/rv32i/Zicsr"}
  - {name: rv32i_zicntr,       extensions: [Zicntr],               tests: 47,  covers: "tests/rv32i/Zicntr (implies Zicsr)"}
  - {name: rv32i_zihpm,        extensions: [Zihpm],                tests: 47,  covers: "tests/rv32i/Zihpm (implies Zicsr)"}
  - {name: rv32i_zicclsm,      extensions: [Zicclsm],              tests: 44,  covers: "tests/rv32i/Zicclsm"}
  - {name: rv32i_zifencei,     extensions: [Zifencei],             tests: 40,  covers: "tests/rv32i/Zifencei"}
  - {name: rv32i_zimop,        extensions: [Zimop],                tests: 79,  covers: "tests/rv32i/Zimop"}
  - {name: rv32i_zicond,       extensions: [Zicond],               tests: 41,  covers: "tests/rv32i/Zicond"}
  - {name: rv32i_zihintntl,    extensions: [Zihintntl],            tests: 43,  covers: "tests/rv32i/Zihintntl"}
  - {name: rv32i_zihintpause,  extensions: [Zihintpause],          tests: 40,  covers: "tests/rv32i/Zihintpause"}
  - {name: rv32e,              extensions: [],                     tests: 39,  covers: "tests/rv32e/E"}
  - {name: rv32em,             extensions: [M],                    tests: 51,  covers: "tests/rv32e/M"}
  - {name: rv32e_zmmul,        extensions: [Zmmul],                tests: 43,  covers: "tests/rv32e/Zmmul"}
  # Everything the core implements, without Zifencei, so that it runs on every memory model.
  - {name: rv32im_full,        extensions: [M, Zicclsm, Zicntr, Zihpm, Zimop, Zicond, Zihintntl, Zihintpause], tests: 113, covers: "every folder above together"}
  # The same with Zifencei, which only the model with both memories external can run.
  - {name: rv32im_full_zifencei, extensions: [M, Zicclsm, Zicntr, Zihpm, Zifencei, Zimop, Zicond, Zihintntl, Zihintpause], tests: 114, covers: "every folder above together, with Zifencei"}
